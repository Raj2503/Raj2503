name: Update Pac-Man contribution graph

on:
  schedule:
    - cron: '17 4 * * 0'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/update-arcade-graph.yml'

permissions:
  contents: write

concurrency:
  group: personal-profile-arcade
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Generate Pac-Man contribution graphs
        # v5.0.0 — pin to the release commit, not a mutable tag.
        uses: abozanona/pacman-contribution-graph@d258e3fb01511c1ff4fe6418408ede37b2ad4935
        with:
          github_user_name: ${{ github.repository_owner }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          games: pacman
          player_style: opportunistic

      - name: Publish generated SVGs
        # v5.0.0 — pin to the release commit, not a mutable tag.
        uses: crazy-max/ghaction-github-pages@1d6ee9b181a81033a16bd707a1401afa978daab4
        with:
          build_dir: dist
          target_branch: output
          keep_history: false
          jekyll: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
